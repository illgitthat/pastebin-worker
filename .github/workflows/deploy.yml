# Deploys are handled by Cloudflare Workers Builds (connected to this repo),
# so no Cloudflare credentials are stored in GitHub. This workflow only tests.
name: Test
on:
  push:
    branches:
      - goshujin

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: "Install pnpm"
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: "Setup"
        run: pnpm install --frozen-lockfile

      - name: "Build Frontend"
        run: pnpm build:frontend

      - name: "Test"
        run: |
          pnpm prettier -c .
          pnpm lint
          pnpm typecheck
          pnpm test --testTimeout 15000
